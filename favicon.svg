<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 100" width="140" height="100">
  <!-- Paper background -->
  <rect width="140" height="100" fill="#f4efe6"/>
  <!-- Ink frame -->
  <rect x="2" y="2" width="136" height="96" fill="none" stroke="#0e1116" stroke-width="4"/>
  <!-- XRP X — 2 chevrons curvés (top + bottom), 4 wedges with curved edges -->
  <g fill="#0e1116">
    <!-- Top-left wedge of top chevron -->
    <path d="M 10 14 L 24 14 Q 32 32, 50 50 Q 22 32, 10 14 Z"/>
    <!-- Top-right wedge of top chevron -->
    <path d="M 90 14 L 76 14 Q 68 32, 50 50 Q 78 32, 90 14 Z"/>
    <!-- Bottom-right wedge of bottom chevron -->
    <path d="M 90 86 L 76 86 Q 68 68, 50 50 Q 78 68, 90 86 Z"/>
    <!-- Bottom-left wedge of bottom chevron -->
    <path d="M 10 86 L 24 86 Q 32 68, 50 50 Q 22 68, 10 86 Z"/>
  </g>
  <!-- B exponent (gold, top-right superscript) -->
  <text x="100" y="44"
        font-family="'Fraunces', Georgia, 'Times New Roman', serif"
        font-size="46"
        font-weight="800"
        fill="#d4a017">B</text>
</svg>
