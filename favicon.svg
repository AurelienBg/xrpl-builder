<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Paper background -->
  <rect width="100" height="100" fill="#f4efe6"/>
  <!-- Ink frame -->
  <rect x="2" y="2" width="96" height="96" fill="none" stroke="#0e1116" stroke-width="4"/>
  <!-- XRP-style X: two crossed bars (like the XRP token logo) -->
  <g transform="translate(35, 60)" fill="#0e1116">
    <rect x="-26" y="-5.5" width="52" height="11" transform="rotate(45)"/>
    <rect x="-26" y="-5.5" width="52" height="11" transform="rotate(-45)"/>
  </g>
  <!-- B exponent: gold, raised, to the right of X (no overlap) -->
  <text x="62" y="42"
        font-family="'Fraunces', Georgia, 'Times New Roman', serif"
        font-size="34"
        font-weight="800"
        fill="#d4a017">B</text>
</svg>
