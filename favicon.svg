<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Paper background -->
  <rect width="100" height="100" fill="#f4efe6"/>
  <!-- Subtle ink frame -->
  <rect x="2" y="2" width="96" height="96" fill="none" stroke="#0e1116" stroke-width="4"/>
  <!-- X — bold serif italic, the base -->
  <text x="22" y="78"
        font-family="'Fraunces', Georgia, 'Times New Roman', serif"
        font-size="78"
        font-weight="800"
        font-style="italic"
        fill="#0e1116">X</text>
  <!-- B — gold serif, the exponent -->
  <text x="60" y="38"
        font-family="'Fraunces', Georgia, serif"
        font-size="34"
        font-weight="800"
        fill="#d4a017">B</text>
</svg>
